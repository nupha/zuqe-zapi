[package]
name = "zuqe_zapi"
version = "0.4.0"
edition = "2024"
description = "Zuqe native extension ABI contract"
repository = "https://github.com/nupha/zuqe-zapi"
license = "Apache-2.0"

[features]
# JSON ↔ ZqValue bridging via the engine's own `JSON` global.
serde_json_support = ["dep:serde_json"]

[dependencies]
serde_json = { version = "1", optional = true }

[dev-dependencies]
serde_json = "1"
